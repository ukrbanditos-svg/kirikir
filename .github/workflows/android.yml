name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Kirikiroid2 runtime
        shell: bash
        run: |
          set -eux
          rm -rf external
          mkdir -p external
          git clone --depth 1 https://github.com/miscdec/Kirikiroid2Renovation.git external/kr2
          git clone --depth 1 --branch new https://github.com/joiplay/Kirikiroid2.git external/k2src
          find external -name gradle-wrapper.jar -delete

          mkdir -p app/src/main/java/org/tvp/kirikiri2
          mkdir -p app/src/main/java/com/amaze/filemanager/filesystem
          mkdir -p app/src/main/java/org/cocos2dx
          mkdir -p app/src/main/jniLibs
          mkdir -p app/libs
          mkdir -p app/src/main/assets

          cp external/kr2/app/src/main/java/org/tvp/kirikiri2/KR2Activity.java app/src/main/java/org/tvp/kirikiri2/
          cp external/kr2/app/src/main/java/org/tvp/kirikiri2/DummyEdit.kt app/src/main/java/org/tvp/kirikiri2/
          cp external/kr2/app/src/main/java/org/tvp/kirikiri2/SDLInputConnection.java app/src/main/java/org/tvp/kirikiri2/
          cp external/kr2/app/src/main/java/com/amaze/filemanager/filesystem/MediaStoreHack.java app/src/main/java/com/amaze/filemanager/filesystem/
          cp -R external/k2src/cocos2d/cocos/platform/android/java/src/org/cocos2dx/lib app/src/main/java/org/cocos2dx/
          cp -R external/kr2/app/src/main/jniLibs/* app/src/main/jniLibs/
          if compgen -G "external/k2src/cocos2d/cocos/platform/android/java/libs/*.jar" > /dev/null; then
            cp external/k2src/cocos2d/cocos/platform/android/java/libs/*.jar app/libs/
          fi
          sed -i 's/System.exit(0);//g' app/src/main/java/org/tvp/kirikiri2/KR2Activity.java
          cp external/kr2/LICENSE app/src/main/assets/KIRIKIRROID2_LICENSE.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kirikir-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
